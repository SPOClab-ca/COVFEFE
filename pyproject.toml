[project]
name = "covfefe"
version = "0.2.0"
description = "COre Variable Feature Extraction Feature Extractor: acoustic, lexical, syntactic and pragmatic feature extraction pipelines"
readme = "README.md"
license = { file = "LICENSE-2.0.txt" }
# nltk >= 3.9 needs Python 3.10; gensim 4.4 ships wheels up to Python 3.13.
requires-python = ">=3.10,<3.14"
dependencies = [
    "click>=8.1",
    "gensim>=4.3.3",        # first release with numpy 2 support; loads the 2018 lda_model_wiki files
    "nltk>=3.9.1",          # 3.9 replaced the pickled punkt tokenizer (CVE-2024-39705) with punkt_tab
    "numpy>=1.26",
    "pandas>=2.1",
    "PyWavelets>=1.5",
    "pyPiper>=0.5.3",
    "requests>=2.32",       # CVE-2024-35195 / CVE-2024-47081 fixes
    "scipy>=1.11",
    "tqdm>=4.66.3",         # CVE-2024-34062 fix
    "wordfreq[jieba]>=3.1", # jieba extra is required for the Chinese (lex_chinese) pipeline
]

[project.optional-dependencies]
dev = [
    "pip-audit",
]

[project.scripts]
covfefe = "covfefe:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["covfefe", "config"]
packages = ["nodes", "pipelines", "utils", "utils.lexicosyntactic"]
